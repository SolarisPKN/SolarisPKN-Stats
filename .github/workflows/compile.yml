name: Compilar Worker

on:
  schedule:
    - cron: '30 23 * * *'   # Todos los días a las 23:30 UTC
  workflow_dispatch:        # Ejecución manual desde GitHub

jobs:
  compile:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Clonar el repositorio
      - name: Checkout código
        uses: actions/checkout@v4
      
      # 2. Configurar Node.js (necesario para ejecutar compile-worker.js)
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      # 3. EJECUTAR EL COMPILADOR (sin npm install)
      - name: Compilar y subir Worker
        run: node compile-worker.js
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          WORKER_NAME: 'solarispkn-stats'  # Opcional, puedes cambiarlo
      
      # 4. Notificar resultado (opcional)
      - name: Notificar resultado
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Worker compilado y subido exitosamente"
          else
            echo "❌ Error al compilar el Worker"
            exit 1
          fi